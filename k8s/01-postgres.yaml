apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  namespace: order-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: order_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
  namespace: order-processing
spec:
  ports:
    - port: 5432
  selector:
    app: order-db
---
